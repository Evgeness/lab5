name: Test Python App

on:
  push:
    branches: [ '*' ]   # можно указать все ветки, но обычно ограничивают, например, dev, main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # соответствует версии в Dockerfile

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx   # библиотеки для тестирования

      - name: Run tests
        run: python -m pytest tests/